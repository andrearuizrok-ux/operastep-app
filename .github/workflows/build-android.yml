name: Build OperaStep Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "operastep_app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operastep_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Generate OperaStep icon and splash
        run: npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build APK and AAB
        run: |
          cd android
          ./gradlew assembleDebug bundleRelease
      - name: Upload OperaStep APK
        uses: actions/upload-artifact@v4
        with:
          name: operastep-1.1.1-apk
          path: operastep_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload OperaStep AAB
        uses: actions/upload-artifact@v4
        with:
          name: operastep-1.1.1-aab
          path: operastep_app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
